# 自主触发 deepin 通用打包 CI (buildpackage-deepin)
#
# 本仓库只负责"发信号"给 tonglingcn/buildpackage-deepin 调度器,
# 真正的 4 架构 (amd64/arm64/riscv64/loong64) 编译 + lintian 检查
# 在调度器仓库内完成, 产物作为 artifact 回传。
#
# 触发方式:
#   1. 推送形如 v1.2.3 的 tag        -> 自动用 crimson 构建
#   2. 手动 workflow_dispatch         -> 可选 codename (apricot/beige/crimson)
#
# 前提: 本仓库需在 Settings -> Secrets 中配置
#   DISPATCH_TOKEN : 一个带 repo + workflow 权限的 Personal Access Token
#   (因为默认 GITHUB_TOKEN 不能跨仓库触发 workflow)

name: build-deepin

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      codename:
        description: 'deepin 发行代号'
        type: choice
        options:
          - crimson
          - beige
          - apricot
        default: 'crimson'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger buildpackage-deepin
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            const codename = context.payload.inputs?.codename || 'crimson';
            const gitref = context.ref
              .replace('refs/tags/', '')
              .replace('refs/heads/', '');
            await github.rest.actions.createWorkflowDispatch({
              owner: 'tonglingcn',
              repo: 'buildpackage-deepin',
              workflow_id: 'build.yml',
              ref: 'master',
              inputs: {
                gitrepo: 'tonglingcn/ipp-usb-assistant',
                gitref: gitref,
                codename: codename
              }
            });
            core.info(`已触发 buildpackage-deepin 构建: ${gitref} @ ${codename}`);
