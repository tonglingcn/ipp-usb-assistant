# 自包含多架构 deb 构建 + 自动发布 Release
#
# 方案:
#   - 使用 linuxdeepin/deepin 官方容器镜像, 在容器内 dpkg-buildpackage 编译
#   - 矩阵覆盖 amd64 / arm64 / loong64 三架构
#   - 推送形如 v* 的 tag 时, 构建完成后自动在本仓库创建 Release 并上传 .deb
#   - 使用仓库自带的 GITHUB_TOKEN, 默认具备 contents: write, 无需跨仓库 PAT
#
# 触发:
#   - 推送 v1.0.1 等 tag
#   - 手动 workflow_dispatch

name: build-deb

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qemu: false
            image: linuxdeepin/deepin:crimson
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu: false
            image: linuxdeepin/deepin:crimson-arm64
          - arch: loong64
            runner: ubuntu-24.04
            qemu: true
            image: linuxdeepin/deepin:crimson-loong64

    name: Build deb (${{ matrix.arch }})
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up QEMU (for loong64)
        if: matrix.qemu == true
        uses: docker/setup-qemu-action@v3
        with:
          platforms: loong64
          image: tonistiigi/binfmt:qemu-v8.1.5

      - name: Build package in deepin container
        run: |
          mkdir -p dist
          docker run --rm \
            --platform linux/${{ matrix.arch }} \
            -v "$PWD:/src" \
            -w /src \
            ${{ matrix.image }} \
            bash -ec '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get -y full-upgrade
              apt-get install -y --no-install-recommends \
                build-essential cmake debhelper \
                qt6-base-dev qt6-tools-dev \
                libdtk6core-dev libdtk6gui-dev libdtk6widget-dev \
                libcups2-dev libsane-dev pkg-config
              rm -rf build && mkdir build && cd build
              cmake .. -DCMAKE_INSTALL_PREFIX=/usr
              make -j$(nproc)
              cd ..
              dpkg-buildpackage -us -uc -b
              cp ../*.deb /src/dist/
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: deb-*
          merge-multiple: false

      - name: Collect debs
        id: debs
        run: |
          mkdir -p upload
          find artifacts -name '*.deb' -exec cp {} upload/ \;
          ls -la upload/
          test -n "$(ls upload/*.deb 2>/dev/null)" || { echo "::error::no .deb found in artifacts"; exit 1; }
          # 输出 workspace 相对路径, 后续步骤在 workspace 根目录执行, 不再切目录
          echo "files=$(ls upload/*.deb | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILES: ${{ steps.debs.outputs.files }}
          REPO: ${{ github.repository }}
        run: |
          set -eux
          ls -la upload/
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --repo "$REPO" --clobber
          else
            gh release create "$TAG" $FILES \
              --repo "$REPO" \
              --title "$TAG" \
              --notes "ipp-usb-assistant $TAG 自动构建产物 (amd64 / arm64 / loong64)

          由 build-deb.yml 在 deepin crimson 官方容器内编译生成。"
          fi
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'
